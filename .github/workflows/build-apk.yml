name: Build APK
permissions:
  contents: write
env:
  # Test AdMob app ID. Replace with YOUR AdMob app ID (looks like ca-app-pub-1234567890123456~1234567890) when you have it.
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Project setup
        run: |
          mkdir -p www assets
          f=$(ls | grep -i '^index\.html$' | head -1)
          cp "$f" www/index.html
          cat > package.json <<'JSON'
          {"name":"port-city","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2","@capacitor/core":"^6.1.2","@capacitor-community/admob":"^6.0.0"},
           "devDependencies":{"@capacitor/assets":"^3.0.5"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.portcity.game","appName":"Port City","webDir":"www","backgroundColor":"#120a20"}
          JSON
          npm install
          npx cap add android
      - name: Make icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          S=1024
          im=Image.new('RGB',(S,S),'#1a0d33')
          d=ImageDraw.Draw(im)
          for y in range(S):
              t=y/S
              d.line([(0,y),(S,y)],fill=(int(42-24*t),int(15-5*t),int(74-42*t)))
          d.ellipse([S*.27,S*.18,S*.73,S*.64],fill='#ff4fa8')
          for x,w,h in [(.2,.08,.25),(.3,.1,.32),(.44,.09,.27),(.56,.11,.36),(.7,.08,.24)]:
              d.rectangle([S*x,S*(.72-h),S*(x+w),S*.72],fill='#120a20')
          d.rectangle([0,S*.72,S,S],fill='#0b0714')
          for i in range(4):
              d.rounded_rectangle([S*(.08+i*.24),S*.84,S*(.08+i*.24+.17),S*.865],radius=12,fill='#27e6e0')
          im.save('assets/icon-only.png')
          PY
          npx @capacitor/assets generate --android --iconBackgroundColor '#120a20' --iconBackgroundColorDark '#120a20' --splashBackgroundColor '#120a20' --splashBackgroundColorDark '#120a20'
      - name: Landscape and fullscreen
        run: |
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/portcity/game/MainActivity.java <<'JAVA'
          package com.portcity.game;

          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
            }
          }
          JAVA
          python3 - <<'PY'
          import os,re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          tag='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'+os.environ['ADMOB_APP_ID']+'"/>'
          if 'gms.ads.APPLICATION_ID' not in s:
              s=re.sub(r'(<application\b[^>]*>)',lambda m:m.group(1)+'\n        '+tag,s,count=1)
          open(p,'w').write(s)
          PY
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PortCity-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PortCity.apk
          gh release view v1 >/dev/null 2>&1 || gh release create v1 --title "Port City" --notes "Latest build"
          gh release upload v1 PortCity.apk --clobber
